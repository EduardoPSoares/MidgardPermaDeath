# ╔══════════════════════════════════════════════════════════════╗
# ║           MIDGARD PERMADEATH - CONFIGURATION                 ║
# ║              Sistema de Morte Permanente                     ║
# ╚══════════════════════════════════════════════════════════════╝

# ════════════════════════════════════════════════════════════════
#                      CONTROLE DE PERMADEATH
# ════════════════════════════════════════════════════════════════
permadeath:
  # Ativa ou desativa o sistema de Permadeath globalmente
  enabled: true
  
  # Lista de regiões do WorldGuard onde o Permadeath é DESATIVADO (Safe Zones)
  # Jogadores que morrerem nestas regiões não serão banidos/espectadores
  disabled-regions:
  - ''

# ════════════════════════════════════════════════════════════════
#                      CONFIGURAÇÕES GERAIS
# ════════════════════════════════════════════════════════════════

# Configurações do Replay
replay:
  # Ativa ou desativa a gravação de fundo automaticamente ao iniciar
  background-recording-enabled: true
  # Tempo em segundos para gravar antes da morte
  time-before: 10
  # Tempo em segundos para gravar depois da morte
  time-after: 10
  # Raio de blocos para gravar entidades ao redor
  radius: 30
  # Intervalo de gravação em ticks (mínimo 4 = 5 FPS)
  # Aumente para 8 ou mais se tiver muitos jogadores (>50) para reduzir lag
  interval-ticks: 4
  # Otimização: Ignorar entidades irrelevantes (Itens, XP, Pinturas, etc)
  ignore-irrelevant-entities: true
  # Otimização: Ignorar monstros (gravar apenas jogadores)
  ignore-monsters: false
  # Distância em blocos para iniciar a gravação (Proximidade)
  # Grava apenas quando jogadores estão próximos uns dos outros
  recording-distance: 10
  # Limpeza Automática: Deletar replays mais antigos que X dias (0 para desativar)
  retention-days: 7
  # Integração com Simple Voice Chat
  # Grava e reproduz áudio de voz dos jogadores durante o replay
  voice-chat:
    # Ativa ou desativa a gravação/reprodução de áudio de voz
    # Requer Simple Voice Chat instalado no servidor e no cliente do viewer
    enabled: true

# Configurações de Morte
death:
  # Estado padrão ao morrer:
  # VALHALLA - Banido para o mundo dos mortos (padrão)
  # SPECTATOR - Modo espectador vanilla
  # GHOST - Modo fantasma (voar, invisível, sem chat)
  # O purgatorio e tratado separadamente na secao abaixo.
  default-type: VALHALLA

# Configurações de Valhalla (Mundo dos Mortos)
valhalla:
  # Nome do mundo para onde os mortos vão (deve existir)
  world: world_the_end
  # Se true, força o modo espectador ao respawnar se estiver morto
  force-spectator: false
  # Se true, impede que espectadores saiam do mundo de Valhalla
  lock-in-world: true
  # Lista de regiões do WorldGuard onde o espectador pode ficar (vazio = livre no mundo)
  allowed-regions: []

# Ritual de Ressurreição
purgatory:
  # Regra adicional: criminosos mortos vao para o purgatorio
  enabled: true
  world: purgatorio
  force-spectator: false
  allowed-regions: []

ritual:
  enabled: false
  # Item necessário para o ritual
  item: NETHER_STAR
  item-name: '&6&lTotem de Odin'
  # Estrutura necessária (Bloco base 3x3 embaixo do bloco de interação)
  base-block: GOLD_BLOCK
  interaction-block: BEACON

# Integração com LuckPerms
luckperms:
  group: criminoso
  duration-hours: 24

# Efeitos Visuais
effects:
  raio-na-morte: true
  lightning-on-death: true
  global-sound: true
  floating-skull: true

# ════════════════════════════════════════════════════════════════
#                      COMANDOS DE RESET
# ════════════════════════════════════════════════════════════════
# Comandos executados ao limpar os dados de um jogador (Permadeath)
# Estes comandos serão executados pelo console
# Placeholders disponíveis: %player% (Nome), %uuid% (UUID)
reset-commands:
- "advancedjobsadmin delete user %player%"
- "mmocore admin reset all %player%"
- "eco set %player% 0"
- "lands admin player %player% delete"
- "backpack clear %player%"
- "lands admin player %player% delete confirm"
- "races reset %player%"
- "skin clear %player%"
- "customfishing statistics reset %player%"
- "quests admin moddata fullreset %player%"
- "mcpets clearStats %player%"

permanent-reset:
  # Espera o jogador realmente sair antes de apagar playerdata e stats
  check-interval-ticks: 10
  post-logout-delay-ticks: 20
  commands:
    - "advancedjobsadmin delete user %player%"
    - "mmocore admin reset all %player%"
    - "eco set %player% 0"
    - "lands admin player %player% delete"
    - "lands admin player %player% delete confirm"
    - "backpack clear %player%"
    - "skin clear %player%"
    - "races reset %player%"
    - "customfishing statistics reset %player%"
    - "quests admin moddata fullreset %player%"
    - "mcpets clearStats %player%"
  plugin-data-dirs:
    - 'MMOCore/userdata'
    - 'MMOItems/userdata'
    - 'MMOInventory/userdata'
    - 'CustomStructures/userdata'
    - 'AdvancedEnchantments/userdata'
    - 'Jobs/config/jobs'
    - 'ShopGUIPlus/players'

